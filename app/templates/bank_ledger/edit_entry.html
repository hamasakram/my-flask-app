{% extends "base.html" %}
{% block title %}Edit Ledger Entry - Bank Ledger{% endblock %}
{% block content %}
{% include "shared/_glass_kit.html" %}
<div class="gk-edit">
<div class="page-header gk-head">
    <div>
        <span class="gk-eyebrow gk-mod-{{ active_module }}">{{ module_label or 'Edit' }}</span>
        <h1>Edit Ledger Entry</h1>
        <p class="page-subtitle">{{ entry.bank.display_name }}</p>
    </div>
</div>

<div class="card highlight-card gk-form-card">
    <form method="POST" class="form-grid">
        <div class="form-group">
            <label for="entry_date">Date</label>
            <input type="date" id="entry_date" name="entry_date" value="{{ entry.entry_date.isoformat() }}" required>
        </div>
        <div class="form-group">
            <label for="deposit">Deposit (money in)</label>
            <input type="number" id="deposit" name="deposit" step="0.01" min="0" value="{{ entry.deposit }}">
        </div>
        <div class="form-group">
            <label for="withdrawal">Withdrawal (money out)</label>
            <input type="number" id="withdrawal" name="withdrawal" step="0.01" min="0" value="{{ entry.withdrawal }}">
        </div>
        <div class="form-group">
            <label for="expense_category">Category</label>
            <select id="expense_category" name="expense_category">
                {% for value, label in expense_categories %}
                <option value="{{ value }}" {% if entry.expense_category == value %}selected{% endif %}>{{ label }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group full-width">
            <label for="notes">Notes</label>
            <textarea id="notes" name="notes" rows="2">{{ entry.notes or '' }}</textarea>
        </div>
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Save Changes</button>
            <a href="{{ cancel_url }}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
</div>
{% endblock %}
