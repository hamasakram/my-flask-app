{# In-Hall stock page + hall stock edit form + all Ink pages. Kept in the template (not style.css) so a
   phone with an old cached style.css still gets the right styles. Classes: ih-*
   Liquid Glass: colours come from the style.css tokens (--glass-*, --tint-*, --line…) with fallbacks. #}
<style>
/* Liquid Glass: uses the tokens from style.css (with fallbacks for an old cached style.css) */
.ih-page { --ih-ink: var(--text, #1a2332); --ih-navy: #1b2740; --ih-line: var(--line, rgba(23, 30, 48, 0.08)); --ih-line-strong: var(--line-strong, rgba(23, 30, 48, 0.15)); --ih-soft: rgba(255, 255, 255, 0.55); --ih-field: var(--field-bg, rgba(255, 255, 255, 0.74)); --ih-amber: #874a06; --ih-amber-bg: var(--tint-amber, rgba(245, 158, 11, 0.16)); --ih-pill-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.85), 0 0 0 1px var(--ih-line-strong); }
.ih-num { font-variant-numeric: tabular-nums; }

/* Header */

.ih-btn { display: inline-flex; align-items: center; justify-content: center; gap: 0.4rem; min-height: 2.6rem; padding: 0.55rem 1.15rem; border-radius: 999px; font-size: 0.92rem; font-weight: 600; line-height: 1.2; text-decoration: none; cursor: pointer; border: none; font-family: inherit; transition: transform 0.15s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.15s ease, background 0.15s ease, filter 0.15s ease; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
.ih-btn:hover { transform: translateY(-1px); }
.ih-btn:active { transform: scale(0.98); }
.ih-btn svg { width: 1rem; height: 1rem; flex-shrink: 0; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.ih-btn-primary { color: white; background: linear-gradient(180deg, rgba(255, 255, 255, 0.30) 0%, rgba(255, 255, 255, 0.06) 48%, rgba(255, 255, 255, 0) 52%), linear-gradient(180deg, #cf343a 0%, #a8191f 100%); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.5), inset 0 -1px 0 rgba(0, 0, 0, 0.14), 0 0 0 1px rgba(143, 24, 27, 0.35), 0 8px 20px -8px rgba(178, 30, 34, 0.7); }

.ih-btn[disabled] { opacity: 0.6; cursor: not-allowed; transform: none; }
.ih-btn:focus-visible, .ih-chip:focus-visible, .ih-fam:focus-visible, .ih-pick:focus-visible, .ih-act:focus-visible, .ih-close:focus-visible, .ih-roll-x:focus-visible, .ih-link:focus-visible { outline: 3px solid rgba(59, 130, 246, 0.55); outline-offset: 2px; }

/* Summary */
.ih-summary { padding: 1.1rem 1.25rem 1rem; }
.ih-totals { display: flex; align-items: baseline; gap: 0.4rem 1.75rem; flex-wrap: wrap; margin-bottom: 0.85rem; }
.ih-total-main { font-size: 2.1rem; font-weight: 750; color: var(--ih-navy); letter-spacing: -0.03em; line-height: 1.1; font-variant-numeric: tabular-nums; }
.ih-total-main small { font-size: 1rem; font-weight: 600; color: var(--muted); margin-left: 0.15rem; letter-spacing: 0; }

.ih-fam:hover { background: rgba(255, 255, 255, 0.85); }
.ih-fam:active { transform: scale(0.98); }
.ih-fam[aria-pressed="true"] { background: rgba(178, 30, 34, 0.08); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.7), inset 0 0 0 1.5px rgba(178, 30, 34, 0.7), 0 4px 12px -6px rgba(178, 30, 34, 0.45); }

/* Panels (add / transfer) */

.ih-panel-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 1rem; margin-bottom: 1rem; }

.ih-form input:focus, .ih-form select:focus, .ih-search input:focus, .ih-sort:focus { outline: none; border-color: rgba(59, 130, 246, 0.65); background-color: rgba(255, 255, 255, 0.95); box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.2); }
.ih-form input.ih-auto { background-color: rgba(241, 243, 247, 0.75); color: var(--ih-navy); font-weight: 700; border-style: dashed; }
.ih-form input.ih-invalid { border-color: var(--red); box-shadow: 0 0 0 4px rgba(220, 38, 38, 0.14); }
.ih-form input.ih-auto-soft { background-color: rgba(59, 130, 246, 0.08); border-color: rgba(59, 130, 246, 0.45); color: #1e3a8a; font-weight: 700; }

/* Roll builder */
.ih-builder { grid-column: 1 / -1; border: 1px solid rgba(255, 255, 255, 0.65); border-radius: 14px; background: rgba(255, 255, 255, 0.42); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.7), 0 0 0 1px var(--ih-line); padding: 0.85rem 0.9rem 0.9rem; display: flex; flex-direction: column; gap: 0.6rem; }

.ih-quick { display: flex; align-items: center; gap: 0.4rem; flex-wrap: wrap; }

.ih-quick-row { display: flex; align-items: center; gap: 0.4rem; }

.ih-roll::before { content: ""; width: 0.62rem; height: 0.62rem; border-radius: 50%; box-sizing: border-box; border: 2.5px solid #8b97ad; background: rgba(255, 255, 255, 0.9); flex-shrink: 0; }
.ih-roll-w { font-weight: 600; font-variant-numeric: tabular-nums; }
.ih-roll-n { color: var(--muted); font-weight: 600; }
.ih-roll-edit { padding-right: 0.2rem; background: rgba(255, 255, 255, 0.85); }
.ih-roll-x { width: 1.6rem; height: 1.6rem; border: none; background: transparent; border-radius: 50%; cursor: pointer; color: var(--muted); display: inline-flex; align-items: center; justify-content: center; padding: 0; }
.ih-roll-x:hover { background: rgba(239, 68, 68, 0.14); color: #b91c1c; }
.ih-roll-x svg { width: 10px; height: 10px; stroke: currentColor; stroke-width: 2; stroke-linecap: round; fill: none; }

/* Toolbar */
.ih-toolbar { position: sticky; top: calc(var(--sticky-top, 0px) + 8px); z-index: 6; padding: 0.55rem 0.6rem 0.5rem; margin: 0 0 0.85rem; border-radius: 20px; background: var(--glass-sheen, none), var(--glass-bg-strong, rgba(255, 255, 255, 0.9)); border: 1px solid var(--glass-border, rgba(255, 255, 255, 0.7)); box-shadow: var(--glass-highlight, inset 0 1px 0 #fff), var(--glass-shadow, 0 8px 24px rgba(0, 0, 0, 0.1)); -webkit-backdrop-filter: var(--glass-blur-strong, blur(24px) saturate(180%)); backdrop-filter: var(--glass-blur-strong, blur(24px) saturate(180%)); }
.ih-toolbar-row { display: flex; gap: 0.5rem; align-items: center; }

.ih-search-clear { position: absolute; right: 0.3rem; top: 50%; transform: translateY(-50%); width: 2.2rem; height: 2.2rem; border: none; background: transparent; border-radius: 50%; cursor: pointer; color: var(--muted); display: inline-flex; align-items: center; justify-content: center; }

.ih-chips { display: flex; gap: 0.35rem; margin-top: 0.5rem; overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; padding: 2px 2px 3px; }
.ih-chips::-webkit-scrollbar { display: none; }
.ih-chip { flex-shrink: 0; display: inline-flex; align-items: center; gap: 0.35rem; min-height: 2.25rem; padding: 0.3rem 0.9rem; border-radius: 999px; border: none; background: rgba(255, 255, 255, 0.55); box-shadow: var(--ih-pill-shadow); color: var(--ih-ink); font: inherit; font-size: 0.86rem; font-weight: 600; cursor: pointer; transition: background 0.15s ease, transform 0.15s ease; -webkit-tap-highlight-color: transparent; }
.ih-chip span { color: var(--muted); font-weight: 500; font-size: 0.78rem; }
.ih-chip:hover { background: rgba(255, 255, 255, 0.9); }
.ih-chip:active { transform: scale(0.97); }
.ih-chip[aria-pressed="true"] { color: white; background: linear-gradient(180deg, rgba(255, 255, 255, 0.28) 0%, rgba(255, 255, 255, 0) 55%), linear-gradient(180deg, #c83036 0%, #a3191e 100%); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.45), 0 4px 12px -5px rgba(178, 30, 34, 0.6); }
.ih-chip[aria-pressed="true"] span { color: rgba(255, 255, 255, 0.85); }
.ih-count { font-size: 0.8rem; color: var(--muted); margin: 0.45rem 0 0; }

/* Stock list */
.ih-list { padding: 0; }
.ih-group + .ih-group { border-top: 1px solid var(--ih-line-strong); }
.ih-group[hidden], .ih-row[hidden] { display: none; }
.ih-group-head { position: sticky; top: calc(var(--sticky-top, 0px) + var(--ih-toolbar-h, 0px) + 8px); z-index: 4; display: flex; align-items: center; gap: 0.6rem; padding: 0.7rem 1.1rem; background: linear-gradient(180deg, #fefdfe, #f8f5f8); /* opaque: it is sticky over the rows */ box-shadow: 0 6px 12px -10px rgba(40, 30, 60, 0.35); border-bottom: 1px solid var(--ih-line); }
.ih-group:first-child .ih-group-head { border-radius: 20px 20px 0 0; }

.ih-group-head h3 { margin: 0; font-size: 1rem; font-weight: 700; }

.ih-group-figs strong { color: var(--ih-ink); }
.ih-rows { list-style: none; margin: 0; padding: 0; }
.ih-row { display: grid; grid-template-columns: 8.5rem 7.5rem 5rem minmax(0, 1fr) auto; grid-template-areas: "size kg count rolls actions"; align-items: center; gap: 0.5rem 1rem; padding: 0.75rem 1.1rem; }

.ih-micron { font-size: 0.75rem; font-weight: 700; color: #334155; background: var(--tint-gray, rgba(100, 116, 139, 0.13)); box-shadow: inset 0 0 0 1px var(--tint-gray-border, rgba(100, 116, 139, 0.26)); border-radius: 999px; padding: 0.08rem 0.5rem; white-space: nowrap; }
.ih-kg { grid-area: kg; text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.ih-kg strong { font-size: 1.1rem; }
.ih-kg small { color: var(--muted); font-weight: 600; margin-left: 0.15rem; }
.ih-count-cell { grid-area: count; color: var(--muted); font-size: 0.88rem; white-space: nowrap; font-variant-numeric: tabular-nums; }

.ih-warn { font-size: 0.78rem; color: var(--ih-amber); background: var(--ih-amber-bg); border: none; box-shadow: inset 0 0 0 1px var(--tint-amber-border, rgba(217, 119, 6, 0.32)); border-radius: 10px; padding: 0.25rem 0.55rem; align-self: flex-start; }

.ih-builder .ih-warn { margin: 0; line-height: 1.4; padding: 0.45rem 0.65rem; }
.ih-actions { grid-area: actions; display: flex; gap: 0.3rem; justify-content: flex-end; }
.ih-actions form { margin: 0; display: inline-flex; }
.ih-act { display: inline-flex; align-items: center; justify-content: center; gap: 0.3rem; min-height: 2.25rem; padding: 0.3rem 0.8rem; border-radius: 999px; border: none; background: rgba(255, 255, 255, 0.62); box-shadow: var(--ih-pill-shadow); color: var(--ih-ink); font: inherit; font-size: 0.82rem; font-weight: 600; text-decoration: none; cursor: pointer; white-space: nowrap; transition: background 0.15s ease, transform 0.15s ease; -webkit-tap-highlight-color: transparent; }
.ih-act:hover { background: rgba(255, 255, 255, 0.95); color: var(--ih-ink); }

.ih-act-go { color: #1e40af; background: rgba(59, 130, 246, 0.11); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.6), 0 0 0 1px rgba(37, 99, 235, 0.26); }

.ih-more { display: none; grid-area: more; width: 2.25rem; height: 2.25rem; border-radius: 50%; border: none; box-shadow: var(--ih-pill-shadow); background: rgba(255, 255, 255, 0.65); color: var(--muted); cursor: pointer; align-items: center; justify-content: center; padding: 0; }
.ih-more svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; transition: transform 0.15s; }
.ih-row.ih-open .ih-more { background: var(--ih-navy); box-shadow: none; color: white; }
.ih-row.ih-open .ih-more svg { transform: rotate(180deg); }
.ih-more:focus-visible { outline: 3px solid rgba(59, 130, 246, 0.55); outline-offset: 2px; }
.ih-act-del:hover { color: #991b1b; background: rgba(239, 68, 68, 0.12); box-shadow: 0 0 0 1px rgba(220, 38, 38, 0.25); }
.ih-empty { padding: 2.25rem 1rem; text-align: center; color: var(--muted); }

.ih-empty[hidden] { display: none; }
.ih-empty .ih-btn { margin-top: 0.85rem; }
.ih-link { background: none; border: none; padding: 0; font: inherit; color: #1d4ed8; font-weight: 600; text-decoration: underline; cursor: pointer; }

/* Transfer panel */
