{% extends "base.html" %}
{% from "sh_traders/macros.html" import sh_page_header %}
{% block title %}Edit Investor Purchase - SH Traders{% endblock %}
{% block content %}
{{ sh_page_header('Edit Investor Purchase') }}
<div class="card">
    <form method="POST" class="form-grid" id="edit-purchase-form">
        <div class="form-group">
            <label for="purchase_date">Date</label>
            <input type="date" id="purchase_date" name="purchase_date" value="{{ purchase.purchase_date.isoformat() }}" required>
        </div>
        <div class="form-group">
            <label for="partner_company_id">Investor</label>
            <select id="partner_company_id" name="partner_company_id" required>
                {% for p in partners %}
                <option value="{{ p.id }}" {% if purchase.partner_company_id == p.id %}selected{% endif %}>{{ p.name }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label for="material_name">Material</label>
            <input type="text" id="material_name" name="material_name" value="{{ purchase.material_name }}" required>
        </div>
        <div class="form-group">
            <label for="size">Size</label>
            <input type="text" id="size" name="size" value="{{ purchase.size or '' }}">
        </div>
        <div class="form-group">
            <label for="quantity_kg">Quantity (KG)</label>
            <input type="number" id="quantity_kg" name="quantity_kg" step="0.001" min="0.001" value="{{ purchase.quantity_kg }}" required>
        </div>
        <div class="form-group">
            <label for="rate_per_kg">Rate / KG</label>
            <input type="number" id="rate_per_kg" name="rate_per_kg" step="0.01" min="0.01" value="{{ purchase.rate_per_kg }}" required>
        </div>
        <div class="form-group">
            <label for="investment_amount">Investor Paid</label>
            <input type="number" id="investment_amount" name="investment_amount" step="0.01" min="0.01" value="{{ purchase.investment_amount }}">
        </div>
        <div class="form-group">
            <label for="supplier_name">Supplier</label>
            <input type="text" id="supplier_name" name="supplier_name" value="{{ purchase.supplier_name or '' }}">
        </div>
        <div class="form-group full-width">
            <label for="notes">Notes</label>
            <textarea id="notes" name="notes" rows="2">{{ purchase.notes or '' }}</textarea>
        </div>
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Save Changes</button>
            <a href="{{ cancel_url }}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
