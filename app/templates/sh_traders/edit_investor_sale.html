{% extends "base.html" %}
{% from "sh_traders/macros.html" import sh_page_header %}
{% block title %}Edit Investor Sale - SH Traders{% endblock %}
{% block content %}
{{ sh_page_header('Edit Investor Sale') }}
<div class="card">
    <form method="POST" class="form-grid" id="edit-sale-form">
        <div class="form-group">
            <label for="sale_date">Date</label>
            <input type="date" id="sale_date" name="sale_date" value="{{ sale.sale_date.isoformat() }}" required>
        </div>
        <div class="form-group">
            <label for="invoice_number">Invoice #</label>
            <input type="text" id="invoice_number" name="invoice_number" value="{{ sale.invoice_number }}" required>
        </div>
        <div class="form-group">
            <label for="partner_company_id">Investor</label>
            <select id="partner_company_id" name="partner_company_id" required>
                {% for p in partners %}
                <option value="{{ p.id }}" {% if sale.partner_company_id == p.id %}selected{% endif %}>{{ p.name }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label for="client_company_id">Party</label>
            <select id="client_company_id" name="client_company_id" required>
                {% for c in clients %}
                <option value="{{ c.id }}" {% if sale.client_company_id == c.id %}selected{% endif %}>{{ c.name }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label for="purchase_id">From Purchase</label>
            <select id="purchase_id" name="purchase_id">
                <option value="">— None —</option>
                {% for p in purchases %}
                <option value="{{ p.id }}" {% if sale.purchase_id == p.id %}selected{% endif %}>
                    {{ p.purchase_date.strftime('%d-%m-%Y') }} · {{ p.material_name }}
                </option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label for="material_name">Material</label>
            <input type="text" id="material_name" name="material_name" value="{{ sale.material_name }}" required>
        </div>
        <div class="form-group">
            <label for="size">Size</label>
            <input type="text" id="size" name="size" value="{{ sale.size or '' }}">
        </div>
        <div class="form-group">
            <label for="quantity_kg">Quantity (KG)</label>
            <input type="number" id="quantity_kg" name="quantity_kg" step="0.001" min="0.001" value="{{ sale.quantity_kg }}" required>
        </div>
        <div class="form-group">
            <label for="rate_per_kg">Rate / KG</label>
            <input type="number" id="rate_per_kg" name="rate_per_kg" step="0.01" min="0.01" value="{{ sale.rate_per_kg }}" required>
        </div>
        <div class="form-group full-width">
            <label for="notes">Notes</label>
            <textarea id="notes" name="notes" rows="2">{{ sale.notes or '' }}</textarea>
        </div>
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Save Changes</button>
            <a href="{{ cancel_url }}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
