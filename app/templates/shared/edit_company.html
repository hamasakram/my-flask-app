{% extends "base.html" %}
{% block title %}Edit Company - {{ module_label }}{% endblock %}
{% block content %}
{% include "shared/_glass_kit.html" %}
<div class="gk-edit">
<div class="page-header gk-head">
    <div>
        <span class="gk-eyebrow gk-mod-{{ active_module }}">{{ module_label or 'Edit' }}</span>
        <h1>Edit Company</h1>
        <p class="page-subtitle">{{ module_label }} module</p>
    </div>
</div>

{% if current_user.can_edit() %}
<div class="card highlight-card gk-form-card">
    <form method="POST" class="form-grid">
        <div class="form-group full-width">
            <label for="company_name">Company Name</label>
            <input type="text" id="company_name" name="company_name" value="{{ company.name }}" required>
        </div>
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Save Changes</button>
            <a href="{{ cancel_url }}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endif %}
</div>
{% endblock %}
