{% extends "base.html" %}
{% block title %}Edit Cans Left - RN COLOUR{% endblock %}
{% block content %}
<div class="page-header">
    <h1>Edit Cans Left</h1>
    <p class="page-subtitle">{{ txn.ink_type.display_name }}</p>
</div>

{% if current_user.can_edit() %}
<div class="card highlight-card">
    <form method="POST" class="form-grid">
        <div class="form-group">
            <label for="quantity_left">Cans Left</label>
            <input type="number" id="quantity_left" name="quantity_left" step="0.1" min="0" value="{{ txn.quantity_left }}" required>
        </div>
        <div class="form-group">
            <label for="quantity">Cans Used</label>
            <input type="number" id="quantity" name="quantity" step="0.1" min="0.1" value="{{ txn.quantity }}" required>
        </div>
        <div class="form-group">
            <label for="transaction_date">Date</label>
            <input type="date" id="transaction_date" name="transaction_date" value="{{ txn.transaction_date.isoformat() }}" required>
        </div>
        <div class="form-group full-width">
            <label for="where_used">Where Used</label>
            <input type="text" id="where_used" name="where_used" value="{{ txn.where_used or '' }}">
        </div>
        <div class="form-group full-width">
            <label for="notes">Notes</label>
            <input type="text" id="notes" name="notes" value="{{ txn.notes or '' }}">
        </div>
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Save Changes</button>
            <a href="{{ cancel_url }}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endif %}
{% endblock %}
