{% extends "base.html" %}
{% block title %}Edit Material{% endblock %}
{% block content %}
<div class="page-header">
    <h1>Edit Material</h1>
    <p class="page-subtitle">{{ material.display_name }}</p>
</div>

{% if current_user.can_edit() %}
<div class="card highlight-card">
    <form method="POST" class="form-grid">
        <div class="form-group">
            <label for="category">Category Name</label>
            <input type="text" id="category" name="category" value="{{ material.category }}" required>
        </div>
        <div class="form-group">
            <label for="material_name">Material Name</label>
            <input type="text" id="material_name" name="material_name" value="{{ material.name }}" required>
        </div>
        <div class="form-group">
            <label for="size">Size</label>
            <input type="text" id="size" name="size" value="{{ material.size or '' }}">
        </div>
        <div class="form-group">
            <label for="micron">Micron</label>
            <input type="text" id="micron" name="micron" value="{{ material.micron or '' }}">
        </div>
        <div class="form-group">
            <label>Stock In</label>
            <input type="text" readonly value="{{ '%.1f'|format(stock_in) }}">
        </div>
        <div class="form-group">
            <label>Used</label>
            <input type="text" readonly value="{{ '%.1f'|format(used) }}">
        </div>
        <div class="form-group">
            <label for="left_kg">Left (KG)</label>
            <input type="number" id="left_kg" name="left_kg" step="0.1" value="{{ current }}" required>
            <small class="field-note">Stock left is saved everywhere — Stock In and Used records stay unchanged.</small>
        </div>
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Save Changes</button>
            <a href="{{ cancel_url }}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endif %}
{% endblock %}
