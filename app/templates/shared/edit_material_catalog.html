{% extends "base.html" %}
{% block title %}Edit Material{% endblock %}
{% block content %}
<div class="page-header">
    <h1>Edit Material</h1>
    <p class="page-subtitle">{{ material.display_name }}</p>
</div>

{% if current_user.can_edit() %}
<div class="card highlight-card">
    <form method="POST" class="form-grid">
        <div class="form-group">
            <label for="category">Category Name</label>
            <input type="text" id="category" name="category" value="{{ material.category }}" required>
        </div>
        <div class="form-group">
            <label for="material_name">Material Name</label>
            <input type="text" id="material_name" name="material_name" value="{{ material.name }}" required>
        </div>
        <div class="form-group">
            <label for="size">Size</label>
            <input type="text" id="size" name="size" value="{{ material.size or '' }}">
        </div>
        <div class="form-group">
            <label for="micron">Micron</label>
            <input type="text" id="micron" name="micron" value="{{ material.micron or '' }}">
        </div>
        <div class="form-group">
            <label for="initial_kg">KG</label>
            <input type="number" id="initial_kg" name="initial_kg" step="0.1" min="0" value="{{ material.initial_kg }}" required>
        </div>
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Save Changes</button>
            <a href="{{ cancel_url }}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endif %}
{% endblock %}
