{% extends "base.html" %}
{% block title %}Edit Current Stock - Materials{% endblock %}
{% block content %}
<div class="page-header">
    <h1>Edit Current Stock</h1>
    <p class="page-subtitle">{{ material.display_name }}</p>
</div>

{% if current_user.can_edit() %}
<div class="card highlight-card">
    <form method="POST" class="form-grid">
        <div class="form-group">
            <label>Stock In</label>
            <input type="text" readonly value="{{ '%.1f'|format(stock_in) }}">
        </div>
        <div class="form-group">
            <label>Used</label>
            <input type="text" readonly value="{{ '%.1f'|format(used) }}">
        </div>
        <div class="form-group">
            <label for="current_kg">Left (KG)</label>
            <input type="number" id="current_kg" name="current_kg" step="0.1" value="{{ current }}" required>
            <small class="field-note">Update stock left — Stock In and Used records stay unchanged.</small>
        </div>
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Save Current Stock</button>
            <a href="{{ cancel_url }}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endif %}
{% endblock %}
