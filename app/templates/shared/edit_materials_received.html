{% extends "base.html" %}
{% block title %}Edit Stock In - Materials{% endblock %}
{% block content %}
<div class="page-header">
    <h1>Edit Stock In</h1>
    <p class="page-subtitle">{{ txn.material.display_name }}</p>
</div>

{% if current_user.can_edit() %}
<div class="card highlight-card">
    <form method="POST" class="form-grid">
        <div class="form-group full-width">
            <label for="material_id">Material</label>
            <select id="material_id" name="material_id" required>
                {% for material in materials %}
                <option value="{{ material.id }}" {% if material.id == txn.material_id %}selected{% endif %}>{{ material.display_name }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label for="quantity">Quantity (KG)</label>
            <input type="number" id="quantity" name="quantity" step="0.1" min="0.1" value="{{ txn.quantity }}" required>
        </div>
        <div class="form-group">
            <label for="transaction_date">Date</label>
            <input type="date" id="transaction_date" name="transaction_date" value="{{ txn.transaction_date.isoformat() }}" required>
        </div>
        <div class="form-group full-width">
            <label for="notes">Notes</label>
            <input type="text" id="notes" name="notes" value="{{ txn.notes or '' }}">
        </div>
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Save Changes</button>
            <a href="{{ cancel_url }}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endif %}
{% endblock %}
