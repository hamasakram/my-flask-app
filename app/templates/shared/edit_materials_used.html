{% extends "base.html" %}
{% block title %}Edit Stock Left - Materials{% endblock %}
{% block content %}
<div class="page-header">
    <h1>Edit Stock Left</h1>
    <p class="page-subtitle">{{ txn.material.display_name }}</p>
</div>

{% if current_user.can_edit() %}
<div class="card highlight-card">
    <form method="POST" class="form-grid">
        <div class="form-group">
            <label for="quantity_left">Stock Left (KG)</label>
            <input type="number" id="quantity_left" name="quantity_left" step="0.1" min="0" value="{{ txn.quantity_left }}" required>
        </div>
        <div class="form-group">
            <label for="quantity">Used (KG)</label>
            <input type="number" id="quantity" name="quantity" step="0.1" min="0.1" value="{{ txn.quantity }}" required>
        </div>
        <div class="form-group">
            <label for="transaction_date">Date</label>
            <input type="date" id="transaction_date" name="transaction_date" value="{{ txn.transaction_date.isoformat() }}" required>
        </div>
        <div class="form-group full-width">
            <label for="where_used">Where Used (Job Name)</label>
            <input type="text" id="where_used" name="where_used" list="job-names-list" value="{{ txn.where_used or '' }}">
            <datalist id="job-names-list">
                {% for job_name in job_names %}
                <option value="{{ job_name }}"></option>
                {% endfor %}
            </datalist>
        </div>
        <div class="form-group full-width">
            <label>Used In</label>
            <div class="inline-checkboxes">
                <label class="checkbox-inline">
                    <input type="checkbox" id="used_in_printing" name="used_in_printing" {% if txn.used_in_printing %}checked{% endif %}>
                    Printing
                </label>
                <label class="checkbox-inline">
                    <input type="checkbox" id="used_in_lamination" name="used_in_lamination" {% if txn.used_in_lamination %}checked{% endif %}>
                    Lamination
                </label>
            </div>
        </div>
        <div class="form-group">
            <label for="total_production">Total Job Production</label>
            <input type="number" id="total_production" name="total_production" step="0.01" min="0"
                value="{{ txn.printing_production or txn.lamination_production or '' }}">
        </div>
        <div class="form-group full-width">
            <label for="notes">Notes</label>
            <input type="text" id="notes" name="notes" value="{{ txn.notes or '' }}">
        </div>
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Save Changes</button>
            <a href="{{ cancel_url }}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endif %}
{% endblock %}
