{% extends "base.html" %}
{% block title %}Edit {{ label }} - RN COLOUR{% endblock %}
{% block content %}
{% include "shared/_glass_kit.html" %}
<div class="gk-edit">
<div class="page-header gk-head">
    <div>
        <span class="gk-eyebrow gk-mod-{{ active_module }}">{{ module_label or 'Edit' }}</span>
        <h1>Edit {{ label }}</h1>
    </div>
</div>

{% if current_user.can_edit() %}
<div class="card highlight-card gk-form-card">
    <form method="POST" class="form-grid">
        <div class="form-group">
            <label for="name">{{ label }}</label>
            <input type="text" id="name" name="name" value="{{ record.name }}" required>
        </div>
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Save Changes</button>
            <a href="{{ cancel_url }}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endif %}
</div>
{% endblock %}
