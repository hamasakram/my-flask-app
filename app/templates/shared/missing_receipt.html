{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
{% include "shared/_glass_kit.html" %}
<div class="gk-edit">
<div class="page-header gk-head">
    <div>
        <span class="gk-eyebrow gk-mod-{{ active_module }}">{{ module_label or 'Receipt' }}</span>
        <h1>{{ title }}</h1>
    </div>
</div>
<div class="card">
    <p class="callout callout-amber">{{ message }}</p>
    <div class="form-actions" style="margin-top:1rem"><a href="javascript:history.back()" class="btn btn-secondary">Go Back</a></div>
</div>
</div>
{% endblock %}
